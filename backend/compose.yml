services:
  redis-stack:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: mufeng-redis-stack
    ports:
      - "6379:6379"
    volumes:
      - redis-stack-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-stack-data:
