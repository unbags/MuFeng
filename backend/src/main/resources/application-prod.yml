server:
  tomcat:
    accesslog:
      enabled: true
      pattern: '%t %a "%r" %s (%D ms)'

spring:
  sql:
    init:
      mode: never
  ai:
    vectorstore:
      redis:
        initialize-schema: false
  datasource:
    url: jdbc:mysql://localhost:3306/ordering_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true&verifyServerCertificate=true&trustCertificateKeyStoreUrl=file:${TRUSTSTORE_PATH:classpath:truststore.jks}&trustCertificateKeyStorePassword=${TRUSTSTORE_PASSWORD:changeit}
    hikari:
      maximum-pool-size: 200
      minimum-idle: 30
      connection-timeout: 2000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000
      register-mbeans: true

app:
  high-concurrency:
    menu-cache-ttl-seconds: 60
    max-concurrent-order-writes: 80
