server:
  port: 8080
  shutdown: graceful
  tomcat:
    basedir: ./tomcat
    max-connections: 20000
    accept-count: 1000
    threads:
      max: 400
      min-spare: 50

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://localhost:3306/ordering_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
  ai:
    model:
      chat: openai
      embedding: dashscope
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-pro
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      embedding:
        options:
          model: text-embedding-v4
    vectorstore:
      type: milvus
      milvus:
        client:
          host: localhost
          port: 19530
          username: root
          password: Milvus
        database-name: default
        collection-name: mufeng_kb
        embedding-dimension: 1024
        index-type: IVF_FLAT
        metric-type: COSINE
        initialize-schema: true

app:
  # admin credentials are now stored in the users database table
  # username: ${ADMIN_USERNAME:admin}
  # password: ${ADMIN_PASSWORD:admin123}
  cors:
    allowed-origins: http://localhost:7777,http://localhost:8888
  high-concurrency:
    worker-id: 1
    datacenter-id: 1
    menu-cache-ttl-seconds: 30
    max-concurrent-order-writes: 300
  order:
    delivery-fee: 4.00
  storage:
    image-dir: src/main/resources/images
  ai:
    enabled: true
    rag:
      enabled: true
      top-k: 5
      similarity-threshold: 0.65
    tools:
      enabled: true
      audit-enabled: true
    prompt:
      version: v1
      location: classpath:/prompts

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:OrderingSystemJwtSecretKey2024!@#$%^&*()VeryLongAndSecureForJava17}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ordering-backend
